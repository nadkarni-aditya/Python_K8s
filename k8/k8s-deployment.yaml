apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fastapi-app
  name: fastapi-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      containers:
      - image: fastapi-app:latest
        imagePullPolicy: Never
        name: fastapi-app
        ports:
        - containerPort: 8000
        # envFrom pulls EVERY key from the ConfigMap and Secret in as env vars.
        # These env vars OVERRIDE the stale baked-in .env inside the image
        # (pydantic-settings reads env vars before the .env file), which is what
        # kills the localhost ghost.
        envFrom:
        - configMapRef:
            name: fastapi-config
        - secretRef:
            name: fastapi-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10